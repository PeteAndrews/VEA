[project]
name = "vea-prototype"
version = "0.1.0"
description = "VEA assessment graph prototype (PyG + FastAPI + CLI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "torch-geometric>=2.5",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that load the embedding model",
    "jev: tests that call the live hosted Jev API",
]
